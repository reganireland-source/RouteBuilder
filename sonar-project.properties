# SonarQube scan configuration for RouteBuilder.
# Reproduce locally with:
#   docker run --rm --network host -e SONAR_HOST_URL=http://localhost:9000 \
#     -e SONAR_TOKEN=<token> -v "$PWD:/usr/src" sonarsource/sonar-scanner-cli
sonar.projectKey=routebuilder
sonar.projectName=RouteBuilder
sonar.sourceEncoding=UTF-8

sonar.sources=backend,frontend
sonar.tests=backend/tests
sonar.python.version=3.12

# Generated / vendored / data artefacts — not our code under review.
# backend/tests/** is excluded from *main* sources only (sonar.exclusions does not
# apply to sonar.tests) so the test tree is not indexed twice.
sonar.exclusions=\
  **/node_modules/**,\
  frontend/dist/**,\
  backend/data/**,\
  backend/tests/**,\
  frontend/package-lock.json,\
  **/*.svg

# ── Assessed and accepted findings ───────────────────────────────────────────
# These are NOT blanket suppressions. Each entry below is a rule we have
# reviewed against this specific file and concluded does not describe a real
# defect here. Reviewers: please challenge these rather than trust them — the
# reasoning is stated so it can be checked, and removing a line re-enables the
# rule immediately.
sonar.issue.ignore.multicriteria=vitePublicArgs,decorativePrngHtml,decorativePrngEval,buildGitPath,noI18nSuite,noI18nIndex

# docker:S6472 — "Make sure that using ARG/ENV to handle a secret is safe here."
# Fires on frontend/Dockerfile because the build args are named
# VITE_APP_PASSWORD and VITE_GMAPS_API_KEY, which match Sonar's secret-name
# heuristic. They are not secrets, and cannot be:
#   * Vite inlines every VITE_*-prefixed variable into the client JS bundle at
#     build time, so each value is downloaded by every browser that loads the
#     app. No build-time mechanism (ARG, ENV, or a BuildKit secret mount) can
#     make them confidential — the bundle is the disclosure, not the Dockerfile.
#   * VITE_GMAPS_API_KEY is a Google *browser* key, restricted by HTTP referrer
#     and scoped to the Maps JavaScript API. Public exposure is its design.
#   * VITE_APP_PASSWORD is a client-side access gate — obfuscation to deter
#     casual access, explicitly NOT an authentication boundary. See
#     SECURITY_REVIEW.md R1, which recommends fronting the app with enterprise
#     SSO. Real authorization is server-side via ADMIN_KEY, which is never
#     present in any frontend build.
# We have already removed the redundant `ENV VITE_...=$VITE_...` lines, which
# was a genuine improvement: ENV values persist in image metadata readable via
# `docker inspect`, whereas ARGs in a discarded build stage do not.
# THIS VERDICT CHANGES if a genuinely secret value (an ADMIN_KEY, a database
# DSN, a server-side API key) is ever passed into this Dockerfile — at which
# point this exclusion must be removed and a BuildKit secret mount used.
sonar.issue.ignore.multicriteria.vitePublicArgs.ruleKey=docker:S6472
sonar.issue.ignore.multicriteria.vitePublicArgs.resourceKey=frontend/Dockerfile

# S2245 — "Using pseudorandom number generators (PRNGs) is security-sensitive."
# Correct rule, wrong context in these two files. Verified by reading every call
# site (grep Math.random across the whole frontend):
#   * frontend/public/suite.html — 12 calls, all in the RouteSuite landing
#     page's canvas animation: which grid cells become network nodes, whether a
#     node is a hub, its pulse phase, how many edges it gets, and each data
#     packet's direction, speed and size. Purely visual.
#   * frontend/src/components/AlgoEval.tsx — 2 calls, `pick()` and `maybe()`
#     helpers that generate synthetic routes for the algorithm-evaluation
#     screen's test scenarios.
# No session id, token, nonce, password, UUID or cryptographic value anywhere in
# this codebase derives from Math.random() — confirmed by grepping for those
# terms alongside every call site. Unpredictability is not a requirement for any
# of them; a viewer guessing the next packet colour has no security consequence.
# THIS VERDICT CHANGES the moment Math.random() is used for anything an attacker
# could benefit from predicting — an identifier, a token, a nonce, a shuffle
# that determines access. At that point delete the relevant entry and switch the
# call site to crypto.getRandomValues().
sonar.issue.ignore.multicriteria.decorativePrngHtml.ruleKey=javascript:S2245
sonar.issue.ignore.multicriteria.decorativePrngHtml.resourceKey=frontend/public/suite.html
sonar.issue.ignore.multicriteria.decorativePrngEval.ruleKey=typescript:S2245
sonar.issue.ignore.multicriteria.decorativePrngEval.resourceKey=frontend/src/components/AlgoEval.tsx

# typescript:S4036 — "Make sure the PATH variable only contains fixed,
# unwriteable directories." Fires on frontend/vite.config.ts, which runs
# `execSync('git rev-list --count HEAD')` to stamp a build number into the app
# (surfaced in the HealthBar as "Build N").
# Assessment: this executes at BUILD time, in the developer's own checkout or in
# the CI runner — never in the deployed artefact, and never in response to a
# request. It takes no user input. The threat the rule describes requires an
# attacker who can already write to a directory on the build machine's PATH; at
# that point they can replace node, npm or vite itself, so resolving `git` by
# absolute path would not meaningfully reduce the exposure. The call is also
# wrapped in try/catch and falls back to '0', so it is not load-bearing.
# THIS VERDICT CHANGES if this pattern is ever used at runtime, in server code,
# or anywhere the command string could be influenced by user input — those would
# be genuine command-injection surface and must not be excluded.
sonar.issue.ignore.multicriteria.buildGitPath.ruleKey=typescript:S4036
sonar.issue.ignore.multicriteria.buildGitPath.resourceKey=frontend/vite.config.ts

# Web:InternationalizationCheck — flags HTML files that hard-code English UI
# text with no i18n scaffolding (no lang negotiation, no translation strings).
# RouteBuilder is an internal operations tool for one telco's network team; it
# has no requirement, planned or otherwise, to support multiple languages.
# Confirmed with the product owner (2026-07-30) that English-only is the
# intended, permanent state, not an oversight.
# Covers frontend/public/suite.html (9 findings, the RouteSuite portal page)
# and frontend/index.html (1 finding, the app shell).
# THIS VERDICT CHANGES if the product ever needs to support a non-English-
# speaking user base — at that point this is real i18n backlog work, not a
# false positive, and the exclusion should be removed.
sonar.issue.ignore.multicriteria.noI18nSuite.ruleKey=Web:InternationalizationCheck
sonar.issue.ignore.multicriteria.noI18nSuite.resourceKey=frontend/public/suite.html
sonar.issue.ignore.multicriteria.noI18nIndex.ruleKey=Web:InternationalizationCheck
sonar.issue.ignore.multicriteria.noI18nIndex.resourceKey=frontend/index.html
